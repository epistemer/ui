<form action="/catalog/none" class="catalog-form" method="post" novalidate="">
  <div class="ui-field">
    <label class="ui-field-label" for="field--t-1">
      Type
      <span aria-hidden="true" class="ui-field-required">
        *
      </span>
    </label>
    <select class="ui-input" id="field--t-1" name="type" required="">
      <option value="">
        Choose…
      </option>
      <option value="fixed">
        Fixed amount
      </option>
      <option selected="" value="percentage">
        Percentage
      </option>
    </select>
  </div>
  <div class="ui-field" data-ui-when="{&#34;typ&#34;:&#34;c&#34;,&#34;k&#34;:&#34;type&#34;,&#34;op&#34;:&#34;eq&#34;,&#34;v&#34;:&#34;fixed&#34;}" hidden="">
    <label class="ui-field-label" for="field--t-2">
      Amount
      <span aria-hidden="true" class="ui-field-required">
        *
      </span>
    </label>
    <p class="ui-field-help" id="field--t-2-help">
      In the store&#39;s currency.
    </p>
    <input aria-describedby="field--t-2-help" class="ui-input" data-ui-when-off="" dir="auto" disabled="" id="field--t-2" name="amount" required="" type="text">
  </div>
  <div class="ui-field" data-ui-when="{&#34;typ&#34;:&#34;c&#34;,&#34;k&#34;:&#34;type&#34;,&#34;op&#34;:&#34;eq&#34;,&#34;v&#34;:&#34;percentage&#34;}">
    <label class="ui-field-label" for="field--t-3">
      Percentage
      <span aria-hidden="true" class="ui-field-required">
        *
      </span>
    </label>
    <input aria-describedby="field--t-3-error" aria-invalid="true" class="ui-input" id="field--t-3" max="100" min="1" name="percentage" required="" type="number" value="250">
    <p class="ui-field-error" id="field--t-3-error">
      <svg aria-hidden="true" class="ui-icon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="m15 9-6 6"></path>
        <path d="m9 9 6 6"></path>
      </svg>
      <span class="ui-visually-hidden">
        Error:
      </span>
      must be between 1 and 100
    </p>
  </div>
  <div class="ui-field">
    <label class="ui-field-label" for="field--t-4">
      Contact email
    </label>
    <input aria-describedby="field--t-4-error" aria-invalid="true" class="ui-input" dir="ltr" id="field--t-4" name="email" type="email" value="not an email">
    <p class="ui-field-error" id="field--t-4-error">
      <svg aria-hidden="true" class="ui-icon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="m15 9-6 6"></path>
        <path d="m9 9 6 6"></path>
      </svg>
      <span class="ui-visually-hidden">
        Error:
      </span>
      must be an email address
    </p>
  </div>
  <div class="ui-field">
    <div class="ui-field-row">
      <input aria-describedby="field--t-5-error" aria-invalid="true" class="ui-input" id="field--t-5" name="agree" required="" type="checkbox" value="true">
      <label class="ui-field-label" for="field--t-5">
        The terms are agreed
        <span aria-hidden="true" class="ui-field-required">
          *
        </span>
      </label>
    </div>
    <p class="ui-field-error" id="field--t-5-error">
      <svg aria-hidden="true" class="ui-icon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="m15 9-6 6"></path>
        <path d="m9 9 6 6"></path>
      </svg>
      <span class="ui-visually-hidden">
        Error:
      </span>
      is required
    </p>
  </div>
  <button class="ui-button" type="submit">
    Save
  </button>
</form>

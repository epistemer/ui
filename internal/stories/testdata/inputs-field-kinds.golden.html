<form action="/catalog/none" class="catalog-form" method="post" novalidate="">
  <input name="ref" type="hidden" value="">
  <div class="ui-field">
    <label class="ui-field-label" for="field--t-1">
      Wrapped as a gift?
      <span aria-hidden="true" class="ui-field-required">
        *
      </span>
    </label>
    <ui-tristate class="ui-tristate" data-ui-unset="No answer">
      <select class="ui-input" id="field--t-1" name="gift" required="">
        <option value="">
          Choose…
        </option>
        <option value="true">
          Yes
        </option>
        <option value="false">
          No
        </option>
      </select>
      <template class="ui-tristate-marks">
        <svg aria-hidden="true" class="ui-icon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
          <path d="M20 6 9 17l-5-5"></path>
        </svg>
        <svg aria-hidden="true" class="ui-icon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
          <path d="M5 12h14"></path>
        </svg>
        <svg aria-hidden="true" class="ui-icon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </template>
    </ui-tristate>
  </div>
  <fieldset class="ui-group" data-ui-when="{&#34;typ&#34;:&#34;c&#34;,&#34;k&#34;:&#34;gift&#34;,&#34;op&#34;:&#34;eq&#34;,&#34;v&#34;:&#34;true&#34;}" data-ui-when-off="" disabled="" hidden="">
    <legend class="ui-group-legend">
      Gift address
    </legend>
    <div class="ui-field">
      <label class="ui-field-label" for="field--t-3">
        Street
        <span aria-hidden="true" class="ui-field-required">
          *
        </span>
      </label>
      <input class="ui-input" dir="auto" id="field--t-3" name="address.street" required="" type="text">
    </div>
    <div class="ui-field">
      <label class="ui-field-label" for="field--t-4">
        Note for the courier
      </label>
      <textarea class="ui-input" dir="auto" id="field--t-4" name="address.note" placeholder="Ring twice"></textarea>
    </div>
  </fieldset>
  <div class="ui-field ui-upload" data-ui-texts="{&#34;bodyTooLarge&#34;:&#34;These files are too large to send together. Send fewer at a time.&#34;,&#34;chosen&#34;:&#34;%s chosen&#34;,&#34;remove&#34;:&#34;Remove %s&#34;,&#34;tooLarge&#34;:&#34;%s is larger than &#34;,&#34;undo&#34;:&#34;Undo&#34;,&#34;wrongType&#34;:&#34;%s isn&#39;t a type this field takes&#34;}">
    <label class="ui-field-label" for="field--t-5">
      Photos of the toy
    </label>
    <input class="ui-input ui-upload-input" id="field--t-5" multiple="" name="photos" type="file">
    <ul class="ui-upload-chosen"></ul>
    <progress class="ui-upload-progress" hidden="" max="100"></progress>
    <p class="ui-visually-hidden" role="status"></p>
  </div>
  <button class="ui-button" type="submit">
    Save
  </button>
</form>

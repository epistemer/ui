<ui-table class="ui-table" data-ui-own="q sort page size customer_id status placed_at.from placed_at.to" data-ui-selected="%d selected" id="orders">
  <p class="ui-table-status ui-visually-hidden" id="orders-status" role="status"></p>
  <form action="/shop/orders" class="ui-table-tools" hx-get="/shop/orders" hx-push-url="true" hx-select="#orders" hx-swap="outerHTML" hx-sync="#orders:replace" hx-target="#orders" id="orders-state" method="get">
    <div class="ui-table-search">
      <label class="ui-visually-hidden" for="orders-q">
        Search
      </label>
      <svg aria-hidden="true" class="ui-icon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
        <path d="m21 21-4.34-4.34"></path>
        <circle cx="11" cy="11" r="8"></circle>
      </svg>
      <input autocomplete="off" class="ui-input" hx-get="/shop/orders" hx-include="#orders-state" hx-push-url="true" hx-select="#orders-results" hx-swap="outerHTML" hx-sync="#orders:replace" hx-target="#orders-results" hx-trigger="input changed delay:300ms, search" id="orders-q" name="q" type="search" value="">
    </div>
    <div class="ui-table-filters">
      <div class="ui-field">
        <label class="ui-field-label" for="field--t-1">
          Customer
        </label>
        <ui-combobox class="ui-combobox" data-ui-search="/shop/customers/search" data-ui-texts="{&#34;clear&#34;:&#34;Clear Customer&#34;,&#34;failed&#34;:&#34;Couldn&#39;t search. Try again.&#34;,&#34;more&#34;:&#34;Keep typing to narrow these down&#34;,&#34;none&#34;:&#34;No matches&#34;,&#34;results&#34;:&#34;Results: %d&#34;}" hx-get="/shop/customers/search" hx-params="none" hx-select="[data-ui-suggestions] &gt; li" hx-swap="innerHTML" hx-sync="this:replace" hx-target="find .ui-combobox-options" hx-trigger="ui-search" id="field--t-1-combobox">
          <input aria-describedby="field--t-1-chosen" class="ui-input" id="field--t-1" inputmode="numeric" name="customer_id" type="text">
          <span class="ui-combobox-chosen" id="field--t-1-chosen"></span>
          <button aria-label="Clear Customer" class="ui-combobox-clear" hidden="" tabindex="-1" type="button">
            ×
          </button>
          <div class="ui-combobox-popup" popover="manual">
            <ul aria-label="Customer" class="ui-combobox-options" id="field--t-1-options" role="listbox"></ul>
            <p class="ui-combobox-status"></p>
          </div>
          <p class="ui-visually-hidden" role="status"></p>
        </ui-combobox>
      </div>
      <div class="ui-field">
        <label class="ui-field-label" for="field--t-2">
          Status
        </label>
        <select class="ui-input" id="field--t-2" name="status">
          <option value="">
            Choose…
          </option>
          <option value="pending">
            pending
          </option>
          <option value="paid">
            paid
          </option>
          <option value="shipped">
            shipped
          </option>
          <option value="refunded">
            refunded
          </option>
        </select>
      </div>
      <fieldset class="ui-group">
        <legend class="ui-group-legend">
          Placed
        </legend>
        <div class="ui-field">
          <label class="ui-field-label" for="field--t-4">
            From
          </label>
          <input class="ui-input" id="field--t-4" name="placed_at.from" type="date">
        </div>
        <div class="ui-field">
          <label class="ui-field-label" for="field--t-5">
            To
          </label>
          <input class="ui-input" id="field--t-5" name="placed_at.to" type="date">
        </div>
      </fieldset>
    </div>
    <button class="ui-button" data-tone="neutral" data-variant="outline" id="orders-apply" type="submit">
      Apply
    </button>
  </form>
  <div class="ui-table-results" data-ui-status="No results" data-ui-url="/shop/orders?page=9" id="orders-results">
    <p class="ui-table-empty">
      This page is past the last one.
      <a href="/shop/orders?page=6" hx-get="/shop/orders?page=6" hx-push-url="true" hx-select="#orders-results" hx-swap="outerHTML" hx-sync="#orders:replace" hx-target="#orders-results" id="orders-empty-link">
        Go to the last page
      </a>
    </p>
  </div>
</ui-table>

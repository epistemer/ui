name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEMPL_VERSION: v0.3.1118

jobs:
  ci:
    name: Go ${{ matrix.go }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ui/forms uses generic methods, so the module needs Go 1.27.
        go: ['1.27.x']
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check templ generate leaves no diff
        if: matrix.os == 'ubuntu-latest'
        run: |
          go run github.com/a-h/templ/cmd/templ@${TEMPL_VERSION} generate
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Build
        run: |
          for m in . examples/shop; do
            (cd "$m" && go build ./...)
          done

      - name: Run go vet
        run: |
          for m in . examples/shop; do
            (cd "$m" && go vet ./...)
          done

      - name: Run staticcheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          for m in . examples/shop; do
            (cd "$m" && go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...)
          done

      - name: Check go.mod is tidy
        if: matrix.os == 'ubuntu-latest'
        run: |
          for m in . examples/shop; do
            (cd "$m" && go mod tidy -diff)
          done

      - name: Run tests with race detector
        run: |
          for m in . examples/shop; do
            (cd "$m" && go test -race ./...)
          done
